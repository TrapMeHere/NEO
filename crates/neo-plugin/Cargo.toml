[package]
name = "neo-plugin"
description = "NEO plugin host: WASM (wasmtime) plugins behind a versioned capability API"
version.workspace = true
publish = false
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Off by default: wasmtime is large and is not part of the minimal playable set (docs/02 §2.7).
wasm-plugins = ["dep:wasmtime"]

[dependencies]
neo-core = { workspace = true }
neo-query = { workspace = true }
neo-editor = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
wasmtime = { workspace = true, optional = true }

[lints]
workspace = true
