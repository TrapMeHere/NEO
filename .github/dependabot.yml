version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # GUI/GPU pins: see ADR-0011; zip's major versions break API compatibility, so never auto-bump across majors.
    ignore:
      - dependency-name: "egui*"
      - dependency-name: "eframe*"
      - dependency-name: "wgpu*"
      - dependency-name: "egui-wgpu*"
      - dependency-name: "egui_dock*"
      - dependency-name: "egui-phosphor*"
      - dependency-name: "zip"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
    groups:
      rust-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "wgpu*"
          - "egui*"
          - "eframe*"
          - "egui-wgpu*"
          - "egui_dock*"
          - "egui-phosphor*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
