name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "theme/**"
      - "book.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 不取消进行中的部署：半途取消可能让线上留下不完整的站点。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.52"

      - name: Build documentation
        run: mdbook build

      # 前置条件：仓库 Settings → Pages → Build and deployment → Source = GitHub Actions。
      # 未启用时本步会以 404 失败（错误信息中已写明原因），不再静默跳过部署。
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
