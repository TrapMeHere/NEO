name: Feature request
description: Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For larger feature proposals, describe the use case first; proposals involving architectural changes may need an ADR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you hit today? Why is the current functionality not enough?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Editing
        - Rendering
        - IO / file formats
        - Performance
        - i18n / localization
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this
