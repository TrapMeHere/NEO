name: Feature request / 功能建议
description: Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        较大的功能建议请先说明使用场景；涉及架构变更的提案可能需要 ADR。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 使用场景
      description: 现在遇到了什么问题？为什么现有功能不够？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 备选方案
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - UI / 界面
        - Editing / 编辑
        - Rendering / 渲染
        - IO / 文件格式
        - Performance / 性能
        - i18n / 本地化
        - Docs / 文档
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this
