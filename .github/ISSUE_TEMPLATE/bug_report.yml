name: Bug report / 缺陷报告
description: Report a reproducible problem in NEO
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 Issue；安全问题请走 SECURITY.md 的私密渠道。
  - type: input
    id: version
    attributes:
      label: NEO version / 版本
      placeholder: "0.1.0 (release zip or commit hash)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / 系统
      options:
        - Windows 10
        - Windows 11
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / 日志与截图
      description: "out/ui-check/*.png 或 NEO_PERF_LOG 日志；请粘贴文本而不是只发截图。"
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have read the FAQ and searched existing issues
          required: true
