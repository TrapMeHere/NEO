name: Bug report
description: Report a reproducible problem in NEO
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please search existing issues first; for security problems use the private channel in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: NEO version
      placeholder: "0.1.0 (release zip or commit hash)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: "out/ui-check/*.png or NEO_PERF_LOG logs; paste text instead of sending screenshots only."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have read the FAQ and searched existing issues
          required: true
